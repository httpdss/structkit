name: build-linux-packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 3.3.0)'
        required: false
        default: ''

jobs:
  build-packages:
    name: Build ${{ matrix.format }} for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        format: [deb, rpm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          # Use workflow input if provided, otherwise extract from pyproject.toml
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); f.close(); print(data['project']['version'])")
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: ${VERSION}"

      - name: Install nfpm
        run: |
          set -euo pipefail
          echo "deb [trusted=yes] https://repo.goreleaser.com/apt/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build virtualenv

      - name: Build Python wheel
        run: |
          python -m build --wheel

      - name: Create vendored virtual environment
        run: |
          set -euo pipefail

          # Create a fresh venv in dist/venv
          mkdir -p dist
          python -m virtualenv dist/venv

          # Install structkit and its dependencies into the venv
          dist/venv/bin/pip install --upgrade pip
          dist/venv/bin/pip install dist/*.whl

          # Clean up unnecessary files to reduce package size
          find dist/venv -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find dist/venv -type f -name "*.pyc" -delete 2>/dev/null || true
          find dist/venv -type f -name "*.pyo" -delete 2>/dev/null || true
          rm -rf dist/venv/lib/python*/site-packages/pip* || true
          rm -rf dist/venv/lib/python*/site-packages/setuptools* || true

      - name: Set architecture for nfpm
        id: arch
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "nfpm_arch=amd64" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "nfpm_arch=arm64" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.format }} package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ steps.arch.outputs.nfpm_arch }}
        run: |
          set -euo pipefail

          # Build the package using nfpm
          if [ "${{ matrix.format }}" = "deb" ]; then
            nfpm package \
              --packager deb \
              --config packaging/debian/nfpm.yaml \
              --target dist/
          elif [ "${{ matrix.format }}" = "rpm" ]; then
            nfpm package \
              --packager rpm \
              --config packaging/rpm/nfpm.yaml \
              --target dist/
          fi

          # List generated packages
          ls -lh dist/*.{deb,rpm} 2>/dev/null || true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: structkit-${{ steps.version.outputs.version }}-${{ matrix.arch }}-${{ matrix.format }}
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 90

  summary:
    name: Build Summary
    needs: build-packages
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Linux Package Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built packages for:" >> $GITHUB_STEP_SUMMARY
          echo "- Debian/Ubuntu (.deb) - amd64, arm64" >> $GITHUB_STEP_SUMMARY
          echo "- Fedora/RHEL (.rpm) - amd64, arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the Actions tab above." >> $GITHUB_STEP_SUMMARY
