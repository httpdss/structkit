name: build-linux-packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check out, build, and attach packages to (e.g. v3.3.1)'
        required: true
        type: string

# GITHUB_TOKEN can attach assets to a release published by release-drafter.
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  build-packages:
    name: Build ${{ matrix.format }} for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        format: [deb, rpm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"
          if [ -z "${TAG}" ]; then
            echo "A release tag is required (release event or workflow_dispatch tag input)"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION} (tag ${TAG})"

      - name: Install nfpm
        run: |
          set -euo pipefail
          echo "deb [trusted=yes] https://repo.goreleaser.com/apt/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build virtualenv

      - name: Build Python wheel
        run: |
          python -m build --wheel

      - name: Create vendored virtual environment
        run: |
          set -euo pipefail

          # Create a fresh venv in dist/venv
          mkdir -p dist
          python -m virtualenv dist/venv

          # Install structkit and its dependencies into the venv
          dist/venv/bin/pip install --upgrade pip
          dist/venv/bin/pip install dist/*.whl

          # Clean up unnecessary files to reduce package size
          find dist/venv -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find dist/venv -type f -name "*.pyc" -delete 2>/dev/null || true
          find dist/venv -type f -name "*.pyo" -delete 2>/dev/null || true
          rm -rf dist/venv/lib/python*/site-packages/pip* || true
          rm -rf dist/venv/lib/python*/site-packages/setuptools* || true

      - name: Set architecture for nfpm
        id: arch
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "nfpm_arch=amd64" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "nfpm_arch=arm64" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.format }} package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ steps.arch.outputs.nfpm_arch }}
        run: |
          set -euo pipefail

          # Build the package using nfpm
          if [ "${{ matrix.format }}" = "deb" ]; then
            nfpm package \
              --packager deb \
              --config packaging/debian/nfpm.yaml \
              --target dist/
          elif [ "${{ matrix.format }}" = "rpm" ]; then
            nfpm package \
              --packager rpm \
              --config packaging/rpm/nfpm.yaml \
              --target dist/
          fi

          # List generated packages
          ls -lh dist/*.{deb,rpm} 2>/dev/null || true

          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ steps.arch.outputs.nfpm_arch }}"
          shopt -s nullglob
          packages=(dist/*.deb dist/*.rpm)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "nfpm did not produce a .deb or .rpm"
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            base="$(basename "${pkg}")"
            if [[ "${base}" != *"${VERSION}"* ]]; then
              echo "Package name is missing version ${VERSION}: ${base}"
              exit 1
            fi
            if [[ "${base}" != *"${ARCH}"* && "${base}" != *x86_64* && "${base}" != *aarch64* ]]; then
              echo "Package name is missing architecture: ${base}"
              exit 1
            fi
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: structkit-${{ steps.version.outputs.version }}-${{ matrix.arch }}-${{ matrix.format }}
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 90

  upload-release-assets:
    name: Upload packages to GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: structkit-*
          merge-multiple: true

      - name: Generate checksums and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          TAG="${RELEASE_TAG}"
          if [ -z "${TAG}" ]; then
            echo "A release tag is required (release event or workflow_dispatch tag input)"
            exit 1
          fi
          VERSION="${TAG#v}"

          packages=(dist/*.deb dist/*.rpm)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No .deb or .rpm packages found to upload"
            exit 1
          fi

          for pkg in "${packages[@]}"; do
            base="$(basename "${pkg}")"
            if [[ "${base}" != *"${VERSION}"* ]]; then
              echo "Package name is missing version ${VERSION}: ${base}"
              exit 1
            fi
            if [[ "${base}" != *amd64* && "${base}" != *arm64* && "${base}" != *x86_64* && "${base}" != *aarch64* ]]; then
              echo "Package name is missing architecture: ${base}"
              exit 1
            fi
          done

          (
            cd dist
            sha256sum -- *.deb *.rpm | sort -k2 > SHA256SUMS
            echo "SHA256SUMS:"
            cat SHA256SUMS
          )

          echo "Uploading to release ${TAG}:"
          ls -lh dist/*.deb dist/*.rpm dist/SHA256SUMS

          gh release upload "${TAG}" dist/*.deb dist/*.rpm dist/SHA256SUMS --clobber

      - name: Summarize release assets
        run: |
          {
            echo "## Packages attached to ${RELEASE_TAG}"
            echo ""
            echo "Uploaded .deb, .rpm, and SHA256SUMS to https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Build Summary
    needs: [build-packages, upload-release-assets]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Linux Package Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built packages for:" >> $GITHUB_STEP_SUMMARY
          echo "- Debian/Ubuntu (.deb) - amd64, arm64" >> $GITHUB_STEP_SUMMARY
          echo "- Fedora/RHEL (.rpm) - amd64, arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Packages are attached to the GitHub release (when the upload job succeeds) and also available as Actions artifacts." >> $GITHUB_STEP_SUMMARY
