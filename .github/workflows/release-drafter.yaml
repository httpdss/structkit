name: release-drafter

on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: release-drafter/release-drafter@v7.5.1
        id: release-drafter
        with:
          config-name: release-drafter.yml
          publish: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update package versions from release draft
        id: package-version
        env:
          RESOLVED_VERSION: ${{ steps.release-drafter.outputs.resolved_version }}
        run: |
          set -euo pipefail
          if [ -z "${RESOLVED_VERSION}" ]; then
            echo "Release Drafter did not resolve a version"
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RESOLVED_VERSION"].removeprefix("v")

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]+(")$',
              rf'\g<1>{version}\2',
              text,
              count=1,
          )
          if count == 0:
              raise SystemExit("pyproject.toml version field was not found")
          pyproject.write_text(updated)

          server_json = Path("server.json")
          data = json.loads(server_json.read_text())
          data["version"] = version
          packages = data.get("packages") or []
          if not packages:
              raise SystemExit("server.json packages entry was not found")
          packages[0]["version"] = version
          server_json.write_text(json.dumps(data, indent=2) + "\n")
          PY

          if git diff --quiet -- pyproject.toml server.json; then
            echo "package versions already match ${RESOLVED_VERSION}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "package versions will be bumped to ${RESOLVED_VERSION}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open package version bump PR
        if: steps.package-version.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: chore/bump-pyproject-version
          delete-branch: true
          commit-message: "chore: bump package version to ${{ steps.release-drafter.outputs.resolved_version }}"
          title: "Bump package version to ${{ steps.release-drafter.outputs.resolved_version }}"
          body: |
            Release Drafter resolved the next release as `${{ steps.release-drafter.outputs.resolved_version }}`.

            This PR updates `pyproject.toml` and `server.json` before the draft release is published so the PyPI and MCP Registry publish workflows can ship a package whose version matches the release tag.
          labels: release
