name: test-script

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Removed hardcoded test API key - use secrets instead if needed

jobs:
  packaging-smoke:
    name: Clean wheel install smoke test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Build wheel and smoke-test a fresh install
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip build
        python -m build --wheel
        python -m venv /tmp/structkit-smoke
        /tmp/structkit-smoke/bin/pip install --upgrade pip
        /tmp/structkit-smoke/bin/pip install dist/*.whl
        /tmp/structkit-smoke/bin/structkit --help
        /tmp/structkit-smoke/bin/structkit generate --help
        python - <<'PY'
        from pathlib import Path
        import zipfile

        wheels = list(Path("dist").glob("*.whl"))
        if len(wheels) != 1:
            raise SystemExit(f"expected one wheel, found {wheels!r}")
        with zipfile.ZipFile(wheels[0]) as wheel:
            metadata_name = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
            metadata = wheel.read(metadata_name).decode("utf-8")
        marker = "mcp-name: app.structkit/mcp"
        if marker not in metadata:
            raise SystemExit("wheel METADATA is missing the MCP Registry ownership marker")
        print(f"MCP ownership marker present in {metadata_name}")
        PY

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements.dev.txt

    - name: Lint with flake8
      run: flake8 --max-line-length=200 .
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy structkit tests
      continue-on-error: true

    - name: Run tests
      env:
        REPORT_OUTPUT: md_report.md
      shell: bash
      run: |
        echo "REPORT_FILE=${REPORT_OUTPUT}" >> "$GITHUB_ENV"
        pytest --cov=structkit --cov-branch --cov-report=xml -v --md-report --md-report-flavor gfm --md-report-exclude-outcomes passed skipped xpassed --md-report-output "$REPORT_OUTPUT" --pyargs tests

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Output reports to the job summary when tests fail
      if: failure()
      shell: bash
      run: |
        if [ -f "$REPORT_FILE" ]; then
          echo "<details><summary>Failed Test Report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
        fi
